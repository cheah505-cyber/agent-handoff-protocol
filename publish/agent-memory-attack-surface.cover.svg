<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1622"/>
      <stop offset="1" stop-color="#0a1018"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2536"/>
      <stop offset="1" stop-color="#131c29"/>
    </linearGradient>
    <linearGradient id="curtain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#35d6e8" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#35d6e8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#35d6e8" stop-opacity="0.32"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#35d6e8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#35d6e8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
    <path d="M0 120H1600M0 240H1600M0 360H1600M0 480H1600M0 600H1600M0 720H1600M0 840H1600"/>
    <path d="M160 0V900M320 0V900M480 0V900M640 0V900M800 0V900M960 0V900M1120 0V900M1280 0V900M1440 0V900"/>
  </g>

  <!-- memory files -->
  <g>
    <rect x="180" y="268" width="250" height="320" rx="14" fill="url(#card)" stroke="#26374d" stroke-width="2"/>
    <rect x="228" y="306" width="250" height="320" rx="14" fill="url(#card)" stroke="#2c4058" stroke-width="2"/>
    <rect x="276" y="344" width="250" height="320" rx="14" fill="url(#card)" stroke="#3a5474" stroke-width="2"/>

    <!-- document lines on the front card -->
    <g stroke="#5d7a9b" stroke-width="6" stroke-linecap="round" opacity="0.75">
      <path d="M306 396H404"/>
      <path d="M306 428H470"/>
      <path d="M306 460H440"/>
      <path d="M306 492H486"/>
      <path d="M306 524H398"/>
      <path d="M306 572H462"/>
      <path d="M306 604H430"/>
    </g>
    <g stroke="#35d6e8" stroke-width="6" stroke-linecap="round" opacity="0.55">
      <path d="M306 540H452"/>
    </g>

    <!-- tampered marker -->
    <circle cx="486" cy="376" r="26" fill="#d94a5a" opacity="0.18"/>
    <circle cx="486" cy="376" r="16" fill="#e0505f"/>
    <rect x="483" y="367" width="6" height="13" rx="3" fill="#0d1420"/>
    <circle cx="486" cy="386" r="3.4" fill="#0d1420"/>
  </g>

  <!-- flow into the gate -->
  <g stroke="#35d6e8" stroke-width="3" stroke-linecap="round" opacity="0.45">
    <path d="M560 470H636" stroke-dasharray="12 12"/>
    <path d="M636 400C676 400 676 470 706 470" fill="none" opacity="0.5"/>
  </g>

  <!-- verification gate -->
  <ellipse cx="760" cy="470" rx="200" ry="260" fill="url(#glow)"/>
  <rect x="700" y="300" width="16" height="340" rx="8" fill="#35d6e8" opacity="0.85"/>
  <rect x="806" y="300" width="16" height="340" rx="8" fill="#35d6e8" opacity="0.85"/>
  <rect x="700" y="470" width="122" height="220" fill="url(#curtain)"/>
  <rect x="694" y="286" width="134" height="14" rx="7" fill="#35d6e8" opacity="0.5" filter="url(#soft)"/>

  <!-- items that passed the gate -->
  <g fill="#9fe8f2" opacity="0.9">
    <rect x="884" y="422" width="86" height="12" rx="6"/>
    <rect x="884" y="462" width="120" height="12" rx="6" opacity="0.75"/>
    <rect x="884" y="502" width="70" height="12" rx="6" opacity="0.55"/>
  </g>

  <!-- agent -->
  <g>
    <circle cx="1258" cy="392" r="50" fill="#1b2738" stroke="#4a6a8a" stroke-width="3"/>
    <circle cx="1242" cy="386" r="7" fill="#35d6e8"/>
    <circle cx="1274" cy="386" r="7" fill="#35d6e8"/>
    <path d="M1240 412H1276" stroke="#5d7a9b" stroke-width="5" stroke-linecap="round"/>
    <path d="M1258 342V318" stroke="#4a6a8a" stroke-width="4" stroke-linecap="round"/>
    <circle cx="1258" cy="310" r="9" fill="#e8b95c"/>
    <path d="M1196 520C1196 476 1224 452 1258 452C1292 452 1320 476 1320 520V556H1196Z" fill="#16202f" stroke="#3a5474" stroke-width="3"/>
    <rect x="1218" y="486" width="80" height="10" rx="5" fill="#5d7a9b" opacity="0.7"/>
    <rect x="1218" y="510" width="56" height="10" rx="5" fill="#5d7a9b" opacity="0.45"/>
  </g>

  <!-- accent -->
  <path d="M180 700H1420" stroke="#e8b95c" stroke-width="2" opacity="0.22"/>
  <circle cx="276" cy="700" r="5" fill="#e8b95c" opacity="0.8"/>
  <circle cx="760" cy="700" r="5" fill="#35d6e8" opacity="0.8"/>
  <circle cx="1258" cy="700" r="5" fill="#e8b95c" opacity="0.8"/>
</svg>
